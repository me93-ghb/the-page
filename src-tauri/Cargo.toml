[package]
name = "the-page"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
tempfile = "3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
